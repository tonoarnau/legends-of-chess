/* ---------- Chess engine: enough to replay known SAN games ----------

const fileIdx = (f) => f.charCodeAt(0) - 97;

function initialPositions() {
    const positions = {};

    for (let c = 0; c < 8; c++) {
        const file = String.fromCharCode(97 + c);
        positions[`b${backRank[c]}${file}8`] = { type: backRank[c], color: "b", row: 0, col: c };
        positions[`bP${file}7`] = { type: "P", color: "b", row: 1, col: c };
        positions[`wP${file}2`] = { type: "P", color: "w", row: 6, col: c };
        positions[`w${backRank[c]}${file}1`] = { type: backRank[c], color: "w", row: 7, col: c };

}
function buildGrid(positions) {
    const grid = Array.from({ length: 8 }, () => Array(8).fill(null));
    const idGrid = Array.from({ length: 8 }, () => Array(8).fill(null));

        const p = positions[id];

        idGrid[p.row][p.col] = id;

}
function pathClear(board, r1, c1, r2, c2) {

        c += dc;

}

}

    newPositions[candidate] = {
        ...src,
        row: destR,
        col: destC,

function computeStates(movesSAN) {
    let positions = initialPositions();

    const states = [{ positions: { ...positions }, from: null, to: null, capturedId: null, secondary: null }];
    let color = "w";
    for (let i = 0; i < movesSAN.length; i++) {
        const result = applyPly(positions, enPassant, movesSAN[i], color);
        positions = result.positions;
        enPassant = result.enPassant;
        states.push({
            positions: { ...positions },
            from: result.from,
            to: result.to,
            capturedId: result.capturedId,
            secondary: result.secondary,
        });
        color = color === "w" ? "b" : "w";
    }
    return states;
}
function computeThreatenedSquares(positions) {
    const { grid } = buildGrid(positions);

    const pieces = Object.values(positions);

            if (attacker.color === target.color)

            if (canReach(attacker.type, attacker.color, grid, attacker.row, attacker.col, target.row, target.col, null)) {
                threatened.add(`${target.row}-${target.col}`);

}

const START_COUNTS = { P: 8, N: 2, B: 2, R: 2, Q: 1, K: 1 };
function capturedPieces(positions, color) {
    const remaining = { P: 0, N: 0, B: 0, R: 0, Q: 0, K: 0 };
    Object.values(positions).forEach((p) => {
        if (p.color === color)
            remaining[p.type]++;
    });
    const captured = [];
    ["Q", "R", "B", "N", "P"].forEach((t) => {
        const n = START_COUNTS[t] - remaining[t];
        for (let i = 0; i < n; i++)
            captured.push({ type: t, color });
    });
    return captured;
}
